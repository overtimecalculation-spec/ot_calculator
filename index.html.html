<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT Calculator Professional</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #0056b3;
            --brand-green: #10b981;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
        }

        body { font-family: 'Poppins', sans-serif; background-color: transparent; margin: 0; padding: 10px; display: flex; justify-content: center; }
        
        .omni-container { 
            width: 100%; 
            max-width: 550px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            overflow: hidden; 
            background: #ffffff; 
        }

        .section-header { 
            background: #f8fafc; 
            padding: 14px 20px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .section-header h2 { 
            font-size: 13px; 
            margin: 0; 
            color: var(--brand-blue); 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.5px;
        }

        .section-content { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
        }

        .input-row { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }

        .input-row label { 
            font-size: 13px; 
            color: var(--text-main); 
            font-weight: 600; 
        }

        .field-group {
            display: flex;
            align-items: stretch;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            min-height: 50px;
        }

        input { 
            flex: 2; 
            padding: 12px; 
            border: none; 
            outline: none; 
            font-size: 16px; 
            font-weight: 600; 
            min-width: 0; 
        }
        
        .unit-select {
            flex: 1;
            border: none;
            border-left: 1px solid var(--border-color);
            background: #f1f5f9;
            padding: 0 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--brand-blue);
            cursor: pointer;
            text-align: center;
            outline: none;
        }

        .results-box { 
            background: #1e293b; 
            color: white; 
            padding: 25px; 
            border-radius: 0 0 12px 12px; 
        }

        .res-line { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 10px; 
            font-size: 13px; 
            color: #94a3b8; 
        }

        .res-line span:last-child { color: white; font-weight: 600; }

        .total-line { 
            border-top: 1px solid #334155; 
            margin-top: 15px; 
            padding-top: 15px; 
            text-align: center; 
        }

        .total-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
        .total-value { font-size: 32px; font-weight: 700; color: var(--brand-green); margin-top: 5px; }
    </style>
</head>
<body>

<div class="omni-container">
    <div class="section-header"><h2>Regular Pay Details</h2></div>
    <div class="section-content">
        <div class="input-row">
            <label>Salary / Regular Rate</label>
            <div class="field-group">
                <input type="number" id="salary" placeholder="0">
                <select id="curr" class="unit-select">
                    <option value="USD" selected>USD</option><option value="GBP">GBP</option><option value="EUR">EUR</option>
                    <option value="PKR">PKR</option><option value="INR">INR</option><option value="RON">RON</option>
                    <option value="CAD">CAD</option><option value="AUD">AUD</option><option value="CHF">CHF</option>
                </select>
                <select id="payFreq" class="unit-select">
                    <option value="hour">Hour</option><option value="day">Day</option><option value="week">Week</option><option value="month" selected>Month</option>
                </select>
            </div>
        </div>

        <div class="input-row">
            <label>Working Hours</label>
            <div class="field-group">
                <input type="number" id="workVal" placeholder="40">
                <select id="workUnit" class="unit-select"><option value
