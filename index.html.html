<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --brand-blue: #0056b3;
        --brand-green: #10b981;
        --text-main: #1e293b;
        --border-color: #e2e8f0; 
    }

    .omni-container { 
        font-family: 'Poppins', sans-serif !important;
        width: 100%; 
        max-width: 550px; 
        border-radius: 15px; 
        border: 1px solid var(--border-color); 
        box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        overflow: hidden; 
        background: #ffffff; 
        margin: 20px auto;
    }

    .section-header { 
        background: #f8fafc; 
        padding: 15px 20px; 
        border-bottom: 1px solid var(--border-color); 
    }

    .section-header h2 { 
        font-size: 14px; 
        margin: 0; 
        color: var(--brand-blue); 
        text-transform: uppercase; 
        font-weight: 700; 
        letter-spacing: 1px;
    }

    .section-content { 
        padding: 25px; 
        display: flex; 
        flex-direction: column; 
        gap: 20px; 
    }

    .input-row label { 
        font-size: 14px; 
        color: var(--text-main); 
        font-weight: 600; 
        margin-bottom: 8px;
        display: block;
    }

    .field-group {
        display: flex;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
        transition: 0.3s;
    }

    .field-group:focus-within {
        border-color: var(--brand-blue);
        box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
    }

    input { 
        flex: 2; 
        padding: 12px; 
        border: none; 
        outline: none; 
        font-size: 16px; 
        font-weight: 500; 
        color: var(--text-main);
    }
    
    .unit-select {
        flex: 1;
        border: none;
        border-left: 1px solid var(--border-color);
        background: #f1f5f9;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--brand-blue);
        cursor: pointer;
        outline: none;
    }

    .results-box { 
        background: #1e293b; 
        color: white; 
        padding: 30px; 
        border-radius: 0 0 15px 15px; 
    }

    .res-line { 
        display: flex; 
        justify-content: space-between; 
        margin-bottom: 12px; 
        font-size: 14px; 
        color: #94a3b8; 
    }

    .res-line span:last-child { color: white; font-weight: 600; }

    .total-line { 
        border-top: 1px solid #334155; 
        margin-top: 20px; 
        padding-top: 20px; 
        text-align: center; 
    }

    .total-label { font-size: 12px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
    .total-value { 
        font-size: 36px; 
        font-weight: 700; 
        color: var(--brand-green); 
        margin-top: 5px; 
    }
</style>

<div class="omni-container">
    <div class="section-header"><h2>Regular Pay Details</h2></div>
    <div class="section-content">
        <div class="input-row">
            <label>Regular Pay</label>
            <div class="field-group">
                <input type="number" id="salary" placeholder="0" oninput="calc()">
                <select id="curr" class="unit-select" onchange="calc()">
                    <option value="$">USD ($)</option><option value="£">GBP (£)</option><option value="€">EUR (€)</option>
                    <option value="Rs">PKR (Rs)</option><option value="₹">INR (₹)</option>
                </select>
                <select id="payFreq" class="unit-select" onchange="calc()">
                    <option value="hour">Hour</option><option value="month" selected>Month</option>
                </select>
            </div>
        </div>

        <div class="input-row">
            <label>Regular Work Duration</label>
            <div class="field-group">
                <input type="number" id="workVal" value="40" oninput="calc()">
                <select class="unit-select" disabled><option>Hours</option></select>
                <select class="unit-select" disabled><option>Week</option></select>
            </div>
        </div>

        <div class="input-row">
            <label>Total Regular Pay</label>
            <div class="field-group" style="background: #f8fafc;">
                <input type="text" id="res-reg-display" readonly value="0.00">
                <select class="unit-select" disabled><option>Total</option></select>
            </div>
        </div>
    </div>

    <div class="section-header"><h2>Overtime Details</h2></div>
    <div class="section-content">
        <div class="input-row">
            <label>OT Multiplier</label>
            <div class="field-group">
                <input type="number" id="multInput" value="1.5" step="0.1" oninput="calc()">
                <select id="multPreset" class="unit-select" onchange="document.getElementById('multInput').value=this.value; calc();">
                    <option value="1.5">1.5x Rate</option><option value="2.0">2.0x Rate</option>
                </select>
            </div>
        </div>
        <div class="input-row">
            <label>Overtime Hours (Per Month)</label>
            <div class="field-group">
                <input type="number" id="otVal" placeholder="0" oninput="calc()">
                <select class="unit-select" disabled><option>Hours</option></select>
            </div>
        </div>
    </div>

    <div class="results-box">
        <div class="res-line"><span>Regular Hourly Rate</span><span><span class="curr-txt">$</span> <span id="out-hourly">0.00</span></span></div>
        <div class="res-line"><span>OT Hourly Rate</span><span><span class="curr-txt">$</span> <span id="out-ot-rate">0.00</span></span></div>
        <div class="res-line"><span>Total OT Pay</span><span><span class="curr-txt">$</span> <span id="out-ot-pay">0.00</span></span></div>
        <div class="total-line">
            <span class="total-label">Estimated Monthly Gross Income</span>
            <div class="total-value"><span class="curr-txt">$</span> <span id="out-gross">0.00</span></div>
        </div>
    </div>
</div>

<script>
    function calc() {
        const salary = parseFloat(document.getElementById('salary').value) || 0;
        const payFreq = document.getElementById('payFreq').value;
        const workVal = parseFloat(document.getElementById('workVal').value) || 0;
        const otVal = parseFloat(document.getElementById('otVal').value) || 0;
        const mult = parseFloat(document.getElementById('multInput').value) || 1.5;
        const curr = document.getElementById('curr').value;

        document.querySelectorAll('.curr-txt').forEach(el => el.innerText = curr);

        let hourly = 0;
        if (payFreq === "hour") {
            hourly = salary;
        } else {
            hourly = salary / (workVal * 4.33); 
        }

        const regTotal = (payFreq === "month") ? salary : (hourly * workVal * 4.33);
        const otRate = hourly * mult;
        const otTotal = otRate * otVal;
        const gross = regTotal + otTotal;

        document.getElementById('res-reg-display').value = regTotal.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('out-hourly').innerText = hourly.toFixed(2);
        document.getElementById('out-ot-rate').innerText = otRate.toFixed(2);
        document.getElementById('out-ot-pay').innerText = otTotal.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('out-gross').innerText = gross.toLocaleString(undefined, {minimumFractionDigits: 2});
    }
    window.onload = calc;
</script>
