<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Overtime Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #10b981;
            --bg-page: #f8fafc;
            --text-label: #64748b;
            --border-color: #e2e8f0;
            --white: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
            color: var(--primary);
        }

        .smart-pay-tool {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            overflow: hidden;
        }

        .calculator-body { padding: 20px; }

        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            margin-bottom: 20px;
        }

        label { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-label); 
            text-transform: uppercase; 
        }

        .field-wrapper {
            display: flex;
            flex-wrap: wrap; /* This allows items to stack on mobile */
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            background: var(--white);
            overflow: hidden;
            transition: 0.3s;
        }

        .field-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        input {
            flex: 2;
            min-width: 140px;
            padding: 12px 15px;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            background: transparent;
        }

        .unit-select {
            flex: 1;
            border: none;
            background: #f1f5f9;
            border-left: 1.5px solid var(--border-color);
            padding: 0 10px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            height: 50px;
            outline: none;
        }

        /* Responsive Fix for Small Screens */
        @media (max-width: 480px) {
            .field-wrapper { flex-direction: row; }
            .unit-select { 
                font-size: 10px; 
                padding: 0 5px;
                min-width: 70px;
            }
            .main-result .res-value.highlight { font-size: 24px ! from 30px; }
        }

        .result-dashboard {
            background: #f8fafc;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .res-card {
            background: var(--white);
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .main-result {
            background: var(--primary);
            flex-direction: column;
            padding: 20px;
            text-align: center;
            color: white;
            border: none;
        }

        .main-result .res-value.highlight {
            color: var(--accent);
            font-size: 28px;
            display: block;
        }

        .res-label { font-size: 10px; color: var(--text-label); font-weight: 600; }
        .res-value { font-size: 15px; font-weight: 700; }
    </style>
</head>
<body>

<div class="smart-pay-tool">
  <div class="calculator-body">
    
    <div class="input-group">
      <label>Regular Pay</label>
      <div class="field-wrapper">
        <input type="number" id="salary" placeholder="0">
        <select class="unit-select curr-sel"><option>USD</option><option>PKR</option></select>
        <select id="payFreq" class="unit-select"><option value="month" selected>Month</option><option value="hour">Hour</option></select>
      </div>
    </div>

    <div class="input-group">
      <label>Regular Work Time</label>
      <div class="field-wrapper">
        <input type="number" id="workVal" placeholder="0">
        <select class="unit-select"><option>Hours</option></select>
        <select id="workFreq" class="unit-select"><option value="week" selected>Week</option><option value="month">Month</option></select>
      </div>
    </div>

    <div class="input-group">
      <label>Total Regular Pay</label>
      <div class="field-wrapper" style="background: #f8fafc;">
        <input type="text" id="res-reg-display" readonly value="0.00" style="color: var(--text-label);">
        <select class="unit-select curr-sel" disabled><option>USD</option></select>
        <select class="unit-select" disabled><option>Month</option></select>
      </div>
    </div>

    <div class="input-group">
      <label>Total Overtime Hours</label>
      <div class="field-wrapper">
        <input type="number" id="otVal" placeholder="0">
        <select class="unit-select"><option>Hours</option></select>
        <select id="otFreq" class="unit-select"><option value="month" selected>Month</option><option value="week">Week</option></select>
      </div>
    </div>

    <div class="input-group">
      <label>OT Multiplier Rate</label>
      <div class="field-wrapper">
        <input type="number" id="multInput" value="1.5" step="0.1">
        <select id="multPreset" class="unit-select"><option value="1.5">1.5x Rate</option><option value="2.0">2.0x Rate</option></select>
      </div>
    </div>

    <div class="result-dashboard">
      <div class="res-card"><span class="res-label">Base Hourly</span><span class="res-value"><span class="curr">USD</span> <span id="out-hourly">0.00</span></span></div>
      <div class="res-card"><span class="res-label">OT Hourly</span><span class="res-value"><span class="curr">USD</span> <span id="out-ot-rate">0.00</span></span></div>
      <div class="res-card main-result">
        <span class="res-label" style="color: rgba(255,255,255,0.6)">Total Monthly Gross</span>
        <span class="res-value highlight"><span class="curr">USD</span> <span id="out-gross">0.00</span></span>
      </div>
    </div>

  </div>
</div>

<script>
    function calc() {
        const salary = parseFloat(document.getElementById('salary').value) || 0;
        const payFreq = document.getElementById('payFreq').value;
        const workVal = parseFloat(document.getElementById('workVal').value) || 0;
        const workFreq = document.getElementById('workFreq').value;
        const otVal = parseFloat(document.getElementById('otVal').value) || 0;
        const otFreq = document.getElementById('otFreq').value;
        const mult = parseFloat(document.getElementById('multInput').value) || 1.5;
        const currency = document.querySelector('.curr-sel').value;

        let monthlyRegHrs = (workFreq === "week") ? workVal * 4.33 : workVal;
        let monthlyOTHrs = (otFreq === "week") ? otVal * 4.33 : otVal;

        let hourly = 0;
        if (monthlyRegHrs > 0) {
            hourly = (payFreq === "hour") ? salary : salary / monthlyRegHrs;
        }

        const regTotal = hourly * monthlyRegHrs;
        const otRate = hourly * mult;
        const otTotal = otRate * monthlyOTHrs;
        const gross = regTotal + otTotal;

        document.querySelectorAll('.curr, .curr-sel').forEach(el => {
            if(el.tagName === 'SPAN') el.innerText = currency;
            if(el.tagName === 'SELECT') el.value = currency;
        });
        
        document.getElementById('res-reg-display').value = regTotal.toLocaleString(undefined,{minimumFractionDigits:2});
        document.getElementById('out-hourly').innerText = hourly.toFixed(2);
        document.getElementById('out-ot-rate').innerText = otRate.toFixed(2);
        document.getElementById('out-gross').innerText = gross.toLocaleString(undefined,{minimumFractionDigits:2});
    }

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calc));
    calc();
</script>
</body>
</html>
