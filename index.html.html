<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Overtime Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #3d5afe;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-page: #f1f5f9;
            --border-color: #cbd5e1;
            --white: #ffffff;
            --accent-green: #10b981;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-page);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .omni-container {
            background: var(--white);
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .section-header {
            background: #f8fafc;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .section-header h2 {
            font-size: 16px;
            margin: 0;
            color: var(--text-dark);
            font-weight: 700;
        }

        .section-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-row label {
            font-size: 13px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .field-group {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: 0.2s;
            background: white;
        }

        .field-group:focus-within {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(61, 90, 254, 0.1);
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            width: 100%;
            background: transparent;
        }

        .dropdown-area {
            display: flex;
            align-items: center;
            background: #fff;
            padding-right: 10px;
        }

        select {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            color: var(--primary-blue);
            font-weight: 600;
            cursor: pointer;
            outline: none;
            padding: 0 5px;
        }

        .divider {
            color: var(--border-color);
            margin: 0 5px;
        }

        /* Results Section */
        .results-box {
            background: #1e293b;
            color: white;
            padding: 25px;
            margin-top: 20px;
        }

        .res-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #94a3b8;
        }

        .res-line span:last-child {
            color: white;
            font-weight: 600;
        }

        .total-line {
            border-top: 1px solid #334155;
            margin-top: 15px;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .total-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .total-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* Mobile specific fix */
        @media (max-width: 480px) {
            .field-group { flex-wrap: wrap; }
            input { flex: 1 1 100%; border-bottom: 1px solid var(--border-color); }
            .dropdown-area { width: 100%; padding: 10px; justify-content: flex-end; }
        }
    </style>
</head>
<body>

<div class="omni-container">
    <div class="section-header">
        <span style="color: var(--primary-blue)">▼</span>
        <h2>Regular work time</h2>
    </div>
    <div class="section-content">
        <div class="input-row">
            <label>Regular pay</label>
            <div class="field-group">
                <input type="number" id="salary" placeholder="0" oninput="calc()">
                <div class="dropdown-area">
                    <select id="curr" onchange="calc()"><option>PKR</option><option>USD</option><option>EUR</option></select>
                    <span class="divider">/</span>
                    <select id="payFreq" onchange="calc()"><option value="hour">hour</option><option value="month" selected>month</option></select>
                </div>
            </div>
        </div>

        <div class="input-row">
            <label>Regular work time</label>
            <div class="field-group">
                <input type="number" id="workVal" placeholder="40" oninput="calc()">
                <div class="dropdown-area">
                    <select><option>hours</option></select>
                    <span class="divider">/</span>
                    <select id="workFreq" onchange="calc()"><option value="week" selected>week</option><option value="month">month</option></select>
                </div>
            </div>
        </div>

        <div class="input-row">
            <label>Total regular pay</label>
            <div class="field-group" style="background: #f8fafc;">
                <input type="text" id="out-reg-total" readonly placeholder="0.00">
                <div class="dropdown-area">
                    <span class="curr-txt" style="font-size: 13px; font-weight: 600; color: var(--primary-blue)">PKR</span>
                    <span class="divider">/</span>
                    <span style="font-size: 13px; font-weight: 600; color: var(--primary-blue)">month</span>
                </div>
            </div>
        </div>
    </div>

    <div class="section-header">
        <span style="color: var(--primary-blue)">▼</span>
        <h2>Overtime</h2>
    </div>
    <div class="section-content">
        <div class="input-row">
            <label>Overtime pay multiplier</label>
            <div class="field-group">
                <input type="number" id="mult" value="1.5" step="0.1" oninput="calc()">
            </div>
        </div>

        <div class="input-row">
            <label>Overtime hours</label>
            <div class="field-group">
                <input type="number" id="otVal" placeholder="0" oninput="calc()">
                <div class="dropdown-area">
                    <select><option>hours</option></select>
                    <span class="divider">/</span>
                    <select id="otFreq" onchange="calc()"><option value="month" selected>month</option><option value="week">week</option></select>
                </div>
            </div>
        </div>
    </div>

    <div class="results-box">
        <div class="res-line"><span>Base Hourly Rate</span><span><span class="curr-txt">PKR</span> <span id="out-hourly">0.00</span></span></div>
        <div class="res-line"><span>OT Hourly Rate</span><span><span class="curr-txt">PKR</span> <span id="out-ot-rate">0.00</span></span></div>
        <div class="res-line"><span>OT Percentage</span><span><span id="out-percent">0</span>%</span></div>
        
        <div class="total-line">
            <span class="total-label">Total Monthly Gross</span>
            <div class="total-value"><span class="curr-txt">PKR</span> <span id="out-gross">0</span></div>
        </div>
    </div>
</div>

<script>
    function calc() {
        const salary = parseFloat(document.getElementById('salary').value) || 0;
        const payFreq = document.getElementById('payFreq').value;
        const workVal = parseFloat(document.getElementById('workVal').value) || 0;
        const workFreq = document.getElementById('workFreq').value;
        const otVal = parseFloat(document.getElementById('otVal').value) || 0;
        const otFreq = document.getElementById('otFreq').value;
        const mult = parseFloat(document.getElementById('mult').value) || 1.5;
        const currency = document.getElementById('curr').value;

        // Sync currency text
        document.querySelectorAll('.curr-txt').forEach(el => el.innerText = currency);

        // Standardize hours to monthly
        let monthlyRegHrs = (workFreq === "week") ? workVal * 4.33 : workVal;
        let monthlyOTHrs = (otFreq === "week") ? otVal * 4.33 : otVal;

        let hourly = 0;
        if (monthlyRegHrs > 0) {
            hourly = (payFreq === "hour") ? salary : salary / monthlyRegHrs;
        }

        const regTotal = hourly * monthlyRegHrs;
        const otRate = hourly * mult;
        const otTotal = otRate * monthlyOTHrs;
        const gross = regTotal + otTotal;
        const percent = gross > 0 ? (otTotal / gross) * 100 : 0;

        document.getElementById('out-reg-total').value = regTotal.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('out-hourly').innerText = hourly.toFixed(2);
        document.getElementById('out-ot-rate').innerText = otRate.toFixed(2);
        document.getElementById('out-percent').innerText = percent.toFixed(1);
        document.getElementById('out-gross').innerText = gross.toLocaleString(undefined, {minimumFractionDigits: 0});
    }
    // Run once on load
    window.onload = calc;
</script>

</body>
</html>
