<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Overtime Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-blue: #0056b3;
            --brand-green: #10b981;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --field-bg: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 5px;
            display: flex;
            justify-content: center;
        }

        .omni-container {
            background: transparent;
            width: 100%;
            max-width: 550px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin-top: 5px;
        }

        .section-header {
            background: rgba(248, 250, 252, 0.9);
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header h2 {
            font-size: 13px;
            margin: 0;
            color: var(--brand-blue);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-row label {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 600;
        }

        /* --- DESKTOP VIEW (Default) --- */
        .field-group {
            display: flex;
            align-items: stretch;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            background: var(--field-bg);
            min-height: 48px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .field-group:focus-within {
            border-color: var(--brand-blue);
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1);
        }

        input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            background: transparent;
        }

        .unit-select {
            border: none;
            border-left: 1px solid var(--border-color);
            background: #f8fafc;
            padding: 0 10px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            color: var(--brand-blue);
            min-width: 65px;
            text-align: center;
        }

        /* --- MOBILE VIEW (Fixing overlap) --- */
        @media (max-width: 480px) {
            .field-group {
                flex-wrap: wrap; /* Items niche drop honge agar jagah kam hogi */
            }

            input {
                width: 100%; /* Input poori line le lega */
                flex: none;
                border-bottom: 1px solid var(--border-color);
            }

            .unit-select {
                flex: 1; /* Dropdowns ek hi line mein rahenge lekin input ke niche */
                border-left: none;
                border-right: 1px solid var(--border-color);
                height: 42px;
                font-size: 10.5px;
            }

            .unit-select:last-child {
                border-right: none;
            }
        }

        .results-box {
            background: #1e293b;
            color: white;
            padding: 20px;
            border-radius: 0 0 12px 12px;
        }

        .res-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #94a3b8;
        }

        .res-line span:last-child { color: white; font-weight: 600; }

        .total-line {
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 15px;
            padding-top: 15px;
            text-align: center;
        }

        .total-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; }
        .total-value { font-size: 30px; font-weight: 800; color: var(--brand-green); margin-top: 5px; }
    </style>
</head>
<body>

<div class="omni-container">
    <div class="section-header">
        <span style="color: var(--brand-blue); font-size: 10px;">⬤</span>
        <h2>Regular Pay Details</h2>
    </div>
    <div class="section-content">
        <div class="input-row">
            <label>Salary / Regular Rate</label>
            <div class="field-group">
                <input type="number" id="salary" placeholder="0">
                <select id="curr" class="unit-select">
                    <option value="USD">USD</option>
                    <option value="GBP">GBP</option>
                    <option value="EUR">EUR</option>
                    <option value="PKR">PKR</option>
                    <option value="INR">INR</option>
                    <option value="RON" selected>RON</option>
                </select>
                <select id="payFreq" class="unit-select">
                    <option value="hour">Hour</option>
                    <option value="month" selected>Month</option>
                </select>
            </div>
        </div>

        <div class="input-row">
            <label>Working Hours</label>
            <div class="field-group">
                <input type="number" id="workVal" placeholder="40">
                <select id="workUnit" class="unit-select"><option value="hours">Hrs</option></select>
                <select id="workFreq" class="unit-select">
                    <option value="week" selected>Week</option>
                    <option value="month">Month</option>
                </select>
            </div>
        </div>
    </div>

    <div class="section-header">
        <span style="color: var(--brand-blue); font-size: 10px;">⬤</span>
        <h2>Overtime Settings</h2>
    </div>
    <div class="section-content">
        <div class="input-row">
            <label>OT Multiplier</label>
            <div class="field-group">
                <input type="number" id="multInput" value="1.5" step="0.1">
                <select id="multPreset" class="unit-select">
                    <option value="1.5">1.5x</option>
                    <option value="2.0">2.0x</option>
                </select>
            </div>
        </div>

        <div class="input-row">
            <label>Overtime Hours Worked</label>
            <div class="field-group">
                <input type="number" id="otVal" placeholder="0">
                <select id="otFreq" class="unit-select">
                    <option value="week">Week</option>
                    <option value="month" selected>Month</option>
                </select>
            </div>
        </div>
    </div>

    <div class="results-box">
        <div class="res-line"><span>Regular Hourly Rate</span><span><span class="curr-txt">RON</span> <span id="out-hourly">0.00</span></span></div>
        <div class="res-line"><span>OT Hourly Rate</span><span><span class="curr-txt">RON</span> <span id="out-ot-rate">0.00</span></span></div>
        <div class="res-line"><span>Total OT Pay</span><span><span class="curr-txt">RON</span> <span id="out-ot-pay">0.00</span></span></div>
        
        <div class="total-line">
            <span class="total-label">Total Monthly Gross Income</span>
            <div class="total-value"><span class="curr-txt">RON</span> <span id="out-gross">0.00</span></div>
        </div>
    </div>
</div>

<script>
    function calc() {
        const salary = parseFloat(document.getElementById('salary').value) || 0;
        const payFreq = document.getElementById('payFreq').value;
        const workVal = parseFloat(document.getElementById('workVal').value) || 0;
        const workFreq = document.getElementById('workFreq').value;
        const otVal = parseFloat(document.getElementById('otVal').value) || 0;
        const otFreq = document.getElementById('otFreq').value;
        const mult = parseFloat(document.getElementById('multInput').value) || 1.5;
        const currency = document.getElementById('curr').value;

        document.querySelectorAll('.curr-txt').forEach(el => el.innerText = currency);

        let weeksPerMonth = 4.33;
        let monthlyRegHrs = (workFreq === "week") ? workVal * weeksPerMonth : workVal;
        let monthlyOTHrs = (otFreq === "week") ? otVal * weeksPerMonth : otVal;

        let hourly = 0;
        if (monthlyRegHrs > 0) {
            if(payFreq === "hour") hourly = salary;
            else hourly = salary / monthlyRegHrs;
        }

        const otRate = hourly * mult;
        const otTotal = otRate * monthlyOTHrs;
        const regIncome = (payFreq === "month") ? salary : (hourly * monthlyRegHrs);
        const gross = regIncome + otTotal;

        document.getElementById('out-hourly').innerText = hourly.toFixed(2);
        document.getElementById('out-ot-rate').innerText = otRate.toFixed(2);
        document.getElementById('out-ot-pay').innerText = otTotal.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('out-gross').innerText = gross.toLocaleString(undefined, {minimumFractionDigits: 2});
    }

    document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calc));
    document.getElementById('multPreset').addEventListener('change', (e) => {
        if(e.target.value !== "custom") { document.getElementById('multInput').value = e.target.value; calc(); }
    });
    window.onload = calc;
</script>
</body>
</html>
